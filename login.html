<!DOCTYPE html>
<html data-bs-theme="dark" lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <meta content="Log in to access your drafts, attempts and subscription." name="description"/>
  <meta content="#141416" name="theme-color"/>
  <title>
   Log in &mdash; PromptForge
  </title>
  <link href="src/brand/promptforge-mark.svg" rel="icon" type="image/svg+xml"/>
  <script src="js/theme.js"></script>
  <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet"/>
  <link href="styles/site.css" rel="stylesheet"/>
  <script src="js/main.js" type="module">
  </script>
 </head>
 <body class="login-page">
  <a class="skip-link visually-hidden-focusable" href="#main-content" id="skip-navigation">
   Skip to content
  </a>
  <header class="site-header" id="site-header">
   <div class="header-inner">
    <a aria-label="Prompt Forge home" class="brand" href="index.html" id="nav-brand">
     <img alt="" height="32" src="src/brand/promptforge-mark.svg" width="32"/>
     <span class="brand-wordmark">Prompt<span class="brand-light">Forge</span></span>
    </a>
    <nav aria-label="Primary navigation" class="primary-nav" id="primary-nav">
     <div class="nav-links">
      <a class="nav-link" href="tasks.html" id="nav-tasks">
       Exercises
      </a>
      <a class="nav-link" href="my-solutions.html" id="nav-solutions">
       Attempt history
      </a>
      <a class="nav-link" href="progress.html" id="nav-progress">
       Progress
      </a>
      <a class="nav-link" href="leaderboard.html" id="nav-leaderboard">
       Leaderboard
      </a>
      <a class="nav-link" href="how-it-works.html" id="nav-how-it-works">
       Guide
      </a>
     </div>
     <div class="nav-actions">
      <a class="btn btn-quiet" href="login.html" id="nav-login">
       Log in
      </a>
      <a class="btn btn-primary btn-sm" href="register.html" id="nav-register">
       Create an account
      </a>
      <a class="account-link is-hidden" id="nav-profile" href="profile.html">
       <span aria-hidden="true" class="account-avatar" id="account-initial">P</span>
       <span>Profile</span>
      </a>
     </div>
    </nav>
    <button aria-controls="primary-nav" aria-expanded="false" aria-label="Show navigation" class="menu-toggle" id="navigation-toggle" type="button">
     <svg aria-hidden="true" fill="none" height="22" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24" width="22">
      <path d="M4 6h16M4 12h16M4 18h16">
      </path>
     </svg>
    </button>
   </div>
  </header>
  <button aria-label="Close navigation" class="nav-backdrop" hidden="" id="nav-backdrop" tabindex="-1" type="button">
  </button>
  <main class="page-shell" data-page="login" id="main-content">
   <section class="auth-layout">
    <div class="auth-panel">
     <header class="page-heading">
      <div>
       <h1>
        Log in
       </h1>
       <p class="page-intro">
        Access your drafts and saved attempts.
       </p>
      </div>
     </header>
     <form class="auth-form" id="login-form" novalidate="">
      <div class="form-field">
       <label class="form-label" for="login-email">
        Email address
       </label>
       <input aria-describedby="login-email-error" aria-invalid="false" autocomplete="email" class="form-control" id="login-email" name="email" required="" type="email"/>
       <div class="invalid-feedback" id="login-email-error">
       </div>
      </div>
      <div class="form-field">
       <label class="form-label" for="login-password">
        Password
       </label>
       <input aria-describedby="login-password-error" aria-invalid="false" autocomplete="current-password" class="form-control" id="login-password" name="password" required="" type="password"/>
       <div class="invalid-feedback" id="login-password-error">
       </div>
      </div>
      <button class="btn btn-primary w-100" id="login-submit" type="submit">
       Log in
      </button>
      <p class="form-status" id="login-status" role="status">
      </p>
      <div class="alert alert-danger is-hidden" id="login-error" role="alert">
      </div>
      <div class="alert alert-success is-hidden" id="login-success" role="status">
      </div>
      <p class="auth-switch">
       <span>
        New to PromptForge?
       </span>
       <a href="register.html" id="login-link-1">
        Create an account
       </a>
      </p>
     </form>
    </div>
   </section>
  </main>
  <footer class="site-footer" id="site-footer">
   <div class="footer-inner">
    <a class="footer-brand" href="index.html">
     PromptForge
     <span>
      &copy; 2026
     </span>
    </a>
    <nav aria-label="Footer navigation" id="footer-nav">
     <a href="how-it-works.html">
      Guide
     </a>
     <a href="how-it-works.html#feedback">
      Feedback
     </a>
     <a href="how-it-works.html#privacy-policy">
      Privacy
     </a>
    </nav>
   </div>
  </footer>
 </body>
</html>
