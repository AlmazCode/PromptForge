<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to your PromptForge account — a platform for training prompt engineering skills">
    <meta name="author" content="Student B">
    <title>Login — PromptForge</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/student-c.css">
    <link rel="stylesheet" href="styles/student-b.css">
</head>
<body>

    <header>
      <div class="container header-container">
        <a class="logo" href="index.html" aria-label="Prompt Forge home">
          <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          Prompt Forge
        </a>
        <input type="checkbox" id="nav-toggle" class="nav-toggle-input" hidden />
        <label for="nav-toggle" class="nav-toggle" aria-label="Toggle navigation">
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </label>
        <nav aria-label="Primary navigation">
          <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="colophon.html">Colophon</a></li>
          <li><a href="tasks.html">Tasks</a></li>
          <li><a href="leaderboard.html">Leaderboard</a></li>
          <li><a href="my-solutions.html">My Solutions</a></li>
          <li><a href="how-it-works.html">How it works</a></li>
          <li><a href="profile.html">Profile</a></li>
          </ul>
        </nav>
        <div class="auth-buttons">
          <a href="login.html" class="btn-ghost">Log in</a>
          <a href="register.html" class="btn-primary">Register</a>
        </div>
      </div>
    </header>

    <main class="app-layout">
        <div class="container">

            <div class="app-header">
                <div class="app-header-left">
                    <h1>Log In</h1>
                    <span class="app-header-meta">Welcome back — enter your credentials</span>
                </div>
            </div>

            <div class="auth-wrap auth-wrap--narrow">
                <form method="post" action="#" class="form-dense">
                    <fieldset>
                        <legend>Your Credentials</legend>

                        <div class="form-field">
                            <label for="email">Email Address *</label>
                            <input type="email" id="email" name="email" required autofocus>
                        </div>

                        <div class="form-field" style="margin-top:12px">
                            <label for="password">Password *</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                    </fieldset>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Log In</button>
                        <button type="reset" class="btn-ghost">Clear</button>
                    </div>
                </form>

                <p class="auth-switch">Don't have an account? <a href="register.html">Create one here</a></p>
            </div>

        </div>
    </main>

    <footer class="footer-compact">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Prompt Forge. All rights reserved.</p>
            </div>
        </div>
    </footer>

</body>
</html>
