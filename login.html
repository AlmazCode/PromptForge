<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to your PromptForge account — a platform for training prompt engineering skills">
    <meta name="author" content="Student B">
    <link rel="icon" type="image/svg+xml" href="src/brand/promptforge-mark.svg">
    <title>Login — PromptForge</title>
    <!-- Bootstrap 5.3.8 from jsDelivr; project CSS follows for brand styling. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/site.css" />
  </head>
<body class="student-b-page login-page d-flex flex-column min-vh-100">

    <header class="navbar navbar-expand-lg sticky-top site-nav site-header" data-bs-theme="dark">
      <!-- Wide header for seven links; content uses its own readable width. -->
      <div class="container-fluid px-3 px-lg-5">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html" aria-label="Prompt Forge home">
          <img class="brand-mark" src="src/brand/promptforge-mark.svg" width="32" height="32" alt="">
          Prompt Forge
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#primaryNav" aria-controls="primaryNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <nav class="collapse navbar-collapse" id="primaryNav" aria-label="Primary navigation">
          <ul class="navbar-nav mx-lg-auto mb-3 mb-lg-0 gap-lg-1">
              <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="tasks.html">Tasks</a></li>
              <li class="nav-item"><a class="nav-link" href="leaderboard.html">Leaderboard</a></li>
              <li class="nav-item"><a class="nav-link" href="my-solutions.html">My Solutions</a></li>
              <li class="nav-item"><a class="nav-link" href="how-it-works.html">How it works</a></li>
              <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
          </ul>
          <div class="d-flex gap-2 pb-2 pb-lg-0">
            <a href="login.html" class="btn btn-outline-light btn-sm" aria-current="page">Log in</a>
            <a href="register.html" class="btn btn-primary btn-sm">Register</a>
          </div>
        </nav>
      </div>
    </header>

    <main class="app-layout flex-grow-1 py-4">
        <div class="container">

            <div class="auth-heading border-bottom pb-3 mb-4">
                <div>
                    <h1 class="display-6 fw-bold mb-1">Log In</h1>
                    <span class="text-secondary">Welcome back — enter your credentials</span>
                </div>
            </div>

            <div class="row justify-content-center">
                <form method="post" action="#" class="auth-card col-12 col-md-8 col-lg-5 card p-4 shadow-sm">
                    <fieldset class="auth-fieldset mb-4">
                        <legend class="fs-5 fw-semibold mb-3">Your Credentials</legend>

                        <div class="mb-3">
                            <label class="form-label" for="email">Email Address *</label>
                            <input class="form-control" type="email" id="email" name="email" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="password">Password *</label>
                            <input class="form-control" type="password" id="password" name="password" required>
                        </div>
                    </fieldset>

                    <div class="auth-actions d-flex flex-wrap gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Log In</button>
                        <button type="reset" class="btn btn-outline-light">Clear</button>
                    </div>
                </form>

                <p class="col-12 text-center text-secondary small mt-3">Don't have an account? <a href="register.html">Create one here</a></p>
            </div>

        </div>
    </main>

    <footer class="border-top py-3 mt-auto">
      <div class="container"><p class="small text-secondary mb-0">&copy; 2026 Prompt Forge. All rights reserved.</p></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
